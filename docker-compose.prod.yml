# =============================================================================
# Production overrides for app services
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# (run.sh handles this automatically with ./run.sh prod)
# =============================================================================

services:

  backend:
    build:
      target: production
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    restart: always

  frontend:
    build:
      target: production
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
    restart: always
