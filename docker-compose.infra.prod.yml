# =============================================================================
# Production overrides for shared infra
# Usage: ./run.sh infra:up --prod  (not yet wired — for future prod use)
# Requires: TLS_MODE=letsencrypt, DOMAIN=yourdomain.com, DNS A record set
# =============================================================================

services:

  traefik:
    ports:
      - "80:80"
      - "443:443"

  postgres:
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M

  keycloak:
    restart: always
    environment:
      KC_LOG_LEVEL: warn
    deploy:
      resources:
        limits:
          memory: 768M

  pgadmin:
    restart: always
